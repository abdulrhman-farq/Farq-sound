# Fly.io configuration for the FastAPI service.
# Worker runs as a separate Fly app (see fly.worker.toml).
#
# First deploy:
#   fly launch --copy-config --name farq-sound-api --dockerfile infra/Dockerfile.api
#   fly secrets set $(grep -v '^#' .env | xargs)
#   fly deploy

app = "farq-sound-api"
primary_region = "fra"            # closest to Saudi Arabia
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "infra/Dockerfile.api"

[env]
  APP_ENV = "production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
