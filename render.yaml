# Farq Sound — Render Blueprint
# ==================================================
# One-click deploy:
#   - farq-sound-api    (FastAPI, HTTP, /health check)
#   - farq-sound-worker (Celery, background — ffmpeg/rubberband baked in)
#   - farq-sound-redis  (Managed Redis, private network)
#
# Uses Docker so ffmpeg + rubberband are installed correctly at image
# build time (Render's Python runtime doesn't allow apt-get at runtime).
#
# Public values (Supabase URL + anon key, brand domains) are pre-filled.
# Only true secrets are sync:false — set them in Render → Environment
# AFTER the blueprint provisions:
#   - SUPABASE_SERVICE_ROLE_KEY
#   - SUPABASE_JWT_SECRET
#   - ELEVENLABS_API_KEY   (leave empty → mock mode)
#   - SENTRY_DSN_API       (optional)

services:
  # ────────────────────────────────────────────────────────────────
  # FastAPI HTTP service
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: farq-sound-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "8000"
      # Redis (auto-wired from the managed service below)
      - key: REDIS_URL
        fromService: { type: redis, name: farq-sound-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: redis, name: farq-sound-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: redis, name: farq-sound-redis, property: connectionString }
      # Brand domains
      - key: APP_BASE_URL
        value: https://farq-sound-web.vercel.app
      - key: API_BASE_URL
        value: https://farq-sound-api.onrender.com
      # Supabase (public values pre-filled, secrets below as sync:false)
      - key: SUPABASE_URL
        value: https://czuruornutpvymdphbmn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6dXJ1b3JudXRwdnltZHBoYm1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzMwNTMsImV4cCI6MjA5NDI0OTA1M30.GWikJi6x1g39LSsPh4fFD_rHBSClcnne4SwCj_LT6vI
      - key: SUPABASE_STORAGE_BUCKET
        value: farq-sound
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # ElevenLabs (empty → silent-tone mock)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      # Sentry (optional)
      - key: SENTRY_DSN_API
        sync: false

  # ────────────────────────────────────────────────────────────────
  # Celery worker (background)
  # ────────────────────────────────────────────────────────────────
  - type: worker
    name: farq-sound-worker
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.worker
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService: { type: redis, name: farq-sound-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: redis, name: farq-sound-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: redis, name: farq-sound-redis, property: connectionString }
      - key: APP_BASE_URL
        value: https://farq-sound-web.vercel.app
      - key: SUPABASE_URL
        value: https://czuruornutpvymdphbmn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6dXJ1b3JudXRwdnltZHBoYm1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzMwNTMsImV4cCI6MjA5NDI0OTA1M30.GWikJi6x1g39LSsPh4fFD_rHBSClcnne4SwCj_LT6vI
      - key: SUPABASE_STORAGE_BUCKET
        value: farq-sound
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: SENTRY_DSN_API
        sync: false

  # ────────────────────────────────────────────────────────────────
  # Managed Redis
  # ────────────────────────────────────────────────────────────────
  - type: redis
    name: farq-sound-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
