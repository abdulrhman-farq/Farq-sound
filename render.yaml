# Farq Sound — Render Blueprint
# ===============================
# Connect this repo in the Render dashboard (Blueprints → New Blueprint),
# Render will read this file and provision everything.
#
# Manual env vars to set in dashboard AFTER first deploy (do NOT commit):
#   - SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#     SUPABASE_JWT_SECRET, SUPABASE_STORAGE_BUCKET
#   - ELEVENLABS_API_KEY (leave empty to run TTS in mock mode)
#   - MOYASAR_API_KEY, MOYASAR_WEBHOOK_SECRET (leave empty for mock)
#   - WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN, RESEND_API_KEY
#   - SENTRY_DSN_API
#
# After the API is live, update apps/web/.env (or your Vercel env):
#   NEXT_PUBLIC_API_BASE_URL = https://<your-api-service>.onrender.com

services:
  # ---- FastAPI HTTP service ----
  - type: web
    name: farq-sound-api
    runtime: python
    plan: starter
    rootDir: apps/api
    region: frankfurt
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: farq-sound
      - key: LOG_LEVEL
        value: info
      - key: CELERY_BROKER_URL
        fromService:
          name: farq-sound-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: farq-sound-redis
          type: redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: farq-sound-redis
          type: redis
          property: connectionString
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: SUPABASE_STORAGE_BUCKET
        value: farq-sound
      # The keys below are set manually in the Render dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MOYASAR_API_KEY
        sync: false
      - key: MOYASAR_PUBLISHABLE_KEY
        sync: false
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_DELIVERY
        value: farq_sound_delivery
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Farq Sound <hello@farqsound.sa>"
      - key: SENTRY_DSN_API
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false

  # ---- Celery worker (audio render pipeline) ----
  - type: worker
    name: farq-sound-worker
    runtime: python
    plan: starter
    rootDir: apps/api
    region: frankfurt
    pythonVersion: "3.12"
    # ffmpeg + rubberband-cli are required for the audio render chain.
    # Render's Python runtime is Debian-based, so apt is available at build.
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg rubberband-cli libsndfile1
      pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    envVars:
      - fromGroup: farq-sound-shared
      - key: CELERY_BROKER_URL
        fromService:
          name: farq-sound-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: farq-sound-redis
          type: redis
          property: connectionString

  # ---- Redis (broker + result backend) ----
  - type: redis
    name: farq-sound-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

envVarGroups:
  - name: farq-sound-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: farq-sound
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: MOYASAR_API_KEY
        sync: false
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN_API
        sync: false
